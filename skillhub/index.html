<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opcp-serverless-brik</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #24292f;
            background-color: #ffffff;
            padding: 2rem;
            max-width: 980px;
            margin: 0 auto;
        }
        #content {
            padding: 1rem 0;
        }
        #content h1 {
            padding-bottom: 0.3em;
            font-size: 2em;
            border-bottom: 1px solid #d0d7de;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }
        #content h2 {
            padding-bottom: 0.3em;
            font-size: 1.5em;
            border-bottom: 1px solid #d0d7de;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }
        #content h3 {
            font-size: 1.25em;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }
        #content p {
            margin-bottom: 1rem;
        }
        #content ul, #content ol {
            margin-bottom: 1rem;
            padding-left: 2em;
        }
        #content li {
            margin-bottom: 0.25rem;
        }
        #content code {
            background-color: #f6f8fa;
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-size: 85%;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }
        #content pre {
            background-color: #f6f8fa;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 1rem;
        }
        #content pre code {
            background-color: transparent;
            padding: 0;
            font-size: 85%;
        }
        #content table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1rem;
        }
        #content th, #content td {
            border: 1px solid #d0d7de;
            padding: 6px 13px;
            text-align: left;
        }
        #content th {
            background-color: #f6f8fa;
            font-weight: 600;
        }
        #content tr:nth-child(2n) {
            background-color: #f6f8fa;
        }
        #content blockquote {
            padding: 0 1em;
            color: #57606a;
            border-left: 0.25em solid #d0d7de;
            margin-bottom: 1rem;
        }
        #content strong {
            font-weight: 600;
        }
        #content a {
            color: #0969da;
            text-decoration: none;
        }
        #content a:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 4rem;
            color: #57606a;
        }
        .error {
            text-align: center;
            padding: 4rem;
            color: #cf222e;
        }
    </style>
</head>
<body>
    <div id="content">
        <div class="loading">Loading documentation...</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        async function loadReadme() {
            const contentEl = document.getElementById('content');
            try {
                const response = await fetch('/README.md');
                if (!response.ok) {
                    throw new Error(`Failed to load README.md (${response.status})`);
                }
                const markdown = await response.text();
                contentEl.innerHTML = marked.parse(markdown);
            } catch (err) {
                contentEl.innerHTML = `<div class="error"><p>Error loading documentation: ${err.message}</p></div>`;
            }
        }
        loadReadme();
    </script>
</body>
</html>
